# AeroSpace Configuration
# https://github.com/nikitabobko/AeroSpace
#
# Based on frankfulness/dotfiles aerospace/aerospace.toml.
# Managed via symlink: ~/.config/aerospace/aerospace.toml → this file.

# Start AeroSpace at login
start-at-login = true

# Optional: launch apps on AeroSpace startup. Uncomment the apps you want to
# place automatically with the startup-only workspace rules below.
after-startup-command = [
  # 'exec-and-forget open -a Ghostty',
  # 'exec-and-forget open -a Arc',
  # 'exec-and-forget open -a Slack',
  # 'exec-and-forget open -a "Notion Calendar"',
]

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
# Disabled to prevent floating windows from snapping back to tiled
enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = false

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focus changes
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Don't change floating windows when focus changes
automatically-unhide-macos-hidden-apps = false

# Sketchybar integration - instant updates on workspace changes
# Pass focused workspace info for faster updates
exec-on-workspace-change = ['/bin/bash', '-c', 'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE PREV_WORKSPACE=$AEROSPACE_PREV_WORKSPACE']

# Gaps between windows (in pixels)
[gaps]
inner.horizontal = 0
inner.vertical =   0
outer.left =       5
outer.bottom =     5
outer.top =        50 # Increased for clean spacing under sketchybar
outer.right =      5

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always declared
[mode.main.binding]

# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon, backtick,
#                   leftSquareBracket, rightSquareBracket, space, enter, esc, backspace, tab
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right

# Alt + Shift + h/j/k/l to focus windows.
# Plain Alt + h/j/k/l is deliberately left unbound so it reaches the terminal:
# zellij binds those to MoveFocusOrTab, and AeroSpace grabs Alt combos globally
# before they reach the focused app.
alt-shift-h = 'focus left'
alt-shift-j = 'focus down'
alt-shift-k = 'focus up'
alt-shift-l = 'focus right'

# Cmd + Alt + h/j/k/l to move windows (displaced from Alt + Shift by the above)
cmd-alt-h = 'move left'
cmd-alt-j = 'move down'
cmd-alt-k = 'move up'
cmd-alt-l = 'move right'

# Alt + 1-9 to focus workspace
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# Alt + Shift + 1-9 to move window to workspace (--focus-follows-window keeps bar updated)
alt-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
alt-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
alt-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
alt-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
alt-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'
alt-shift-6 = 'move-node-to-workspace 6 --focus-follows-window'
alt-shift-7 = 'move-node-to-workspace 7 --focus-follows-window'
alt-shift-8 = 'move-node-to-workspace 8 --focus-follows-window'
alt-shift-9 = 'move-node-to-workspace 9 --focus-follows-window'

# Alt + Tab to focus next workspace on current monitor
alt-tab = 'workspace-back-and-forth'

# Alt + Shift + f to toggle fullscreen.
# Plain Alt + f is deliberately left unbound so it reaches the terminal:
# zellij binds Alt f to ToggleFloatingPanes, and AeroSpace grabs Alt combos
# globally before they reach the focused app.
alt-shift-f = 'fullscreen'

# Alt + s to toggle between horizontal and vertical split
alt-s = 'layout v_accordion' # 'layout h_accordion' | 'layout v_accordion' | 'layout h_tiles' | 'layout v_tiles' | 'layout tiles' | 'layout accordion'

# Alt + r to resize mode (you can also resize by holding Alt + right mouse button)
alt-r = 'mode resize'

# Floating/tiling toggle for focused window only
alt-shift-t = 'layout floating tiling'

# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
enter = 'mode main'
esc = 'mode main'

# Startup workspace placement.
# `if.during-aerospace-startup = true` keeps this to initial arrangement only.
# Remove that line if you want the app to always return to the same workspace.
[[on-window-detected]]
if.app-name-regex-substring = 'Ghostty'
if.during-aerospace-startup = true
check-further-callbacks = true
run = ['move-node-to-workspace 1']

[[on-window-detected]]
if.app-name-regex-substring = 'Arc'
if.during-aerospace-startup = true
check-further-callbacks = true
run = ['move-node-to-workspace 2']

[[on-window-detected]]
if.app-name-regex-substring = 'Slack'
if.during-aerospace-startup = true
check-further-callbacks = true
run = ['move-node-to-workspace 3']

[[on-window-detected]]
if.app-name-regex-substring = 'Notion Calendar'
if.during-aerospace-startup = true
check-further-callbacks = true
run = ['move-node-to-workspace 4']

# App-specific window rules
[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'net.runelite.launcher'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'jp.kiok.nani'
run = 'layout floating'

# Catch-all: refresh sketchybar icons whenever any new window appears
[[on-window-detected]]
run = 'exec-and-forget sleep 0.3 && sketchybar --trigger aerospace_workspace_change'

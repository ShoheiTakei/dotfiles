[window]
# macOS: send Option as Alt so zellij Alt-bindings work
option_as_alt = "Both"
opacity = 0.9
decorations = "Buttonless"

[window.dimensions]
columns = 124
lines = 32

[font]
size = 21

[font.normal]
family = "HackGen Console NF"

[colors.primary]
background = "#1f1f28"

[[keyboard.bindings]]
key = "C"
mods = "Alt"
action = "ToggleViMode"

[[keyboard.bindings]]
key = "Return"
mode = "Vi"
action = "ToggleViMode"

# Claude Code: Shift+Enter = newline (kitty keyboard protocol CSI-u)
[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001b[13;2u"

# Cmd+Shift+U: jump to the Claude pane waiting longest for input.
# `command` spawns the process detached, so nothing is echoed to the terminal.
# zellij has no bind that runs a command without spawning a pane, and Cmd never
# reaches a TUI anyway, so this lives here.
[[keyboard.bindings]]
key = "U"
mods = "Command|Shift"
command = { program = "/Users/s.t/.claude/bin/zj-next", args = [] }
